<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#013867"/>
      <stop offset="0.55" stop-color="#002F55"/>
      <stop offset="1" stop-color="#00223e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9b65f"/>
      <stop offset="1" stop-color="#c79a3a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle corner accent -->
  <rect x="0" y="0" width="1200" height="630" fill="none"/>
  <g opacity="0.06" fill="#FBFAF5">
    <rect x="980" y="-120" width="520" height="520" rx="90" transform="rotate(18 1240 140)"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(120,210)">
    <rect width="156" height="156" rx="30" fill="#FBFAF5"/>
    <rect x="62" y="32" width="32" height="32" fill="#002F55"/>
    <polygon points="62,71 94,87 94,132 64,132" fill="#002F55"/>
  </g>

  <!-- wordmark + tagline -->
  <g transform="translate(320,250)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="1" fill="#FFFFFF">INOV Holding</text>
    <rect x="2" y="34" width="92" height="5" rx="2.5" fill="url(#gold)"/>
    <text x="0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="400" letter-spacing="0.5" fill="#cdd8e4">Intelligent Management, Sustainable Growth</text>
  </g>

  <!-- footer line -->
  <text x="120" y="560" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="3" fill="#9fb1c4">LUANDA · ANGOLA — ACROSS THE AFRICAN CONTINENT</text>
</svg>
